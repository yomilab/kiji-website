name: Sync KiJi release data

on:
  workflow_dispatch:
    inputs:
      release_manifest_url:
        description: Public release.json URL to sync.
        required: false
        default: https://github.com/yomilab/kiji-releases/releases/latest/download/release.json
  repository_dispatch:
    types:
      - kiji-release-published

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Sync release manifest and RSS feed
        env:
          DISPATCH_MANIFEST_URL: ${{ github.event.client_payload.release_manifest_url }}
          INPUT_MANIFEST_URL: ${{ github.event.inputs.release_manifest_url }}
        run: |
          set -euo pipefail
          RELEASE_MANIFEST_URL="${DISPATCH_MANIFEST_URL:-${INPUT_MANIFEST_URL:-https://github.com/yomilab/kiji-releases/releases/latest/download/release.json}}"
          npm run release:sync -- --manifest-url "${RELEASE_MANIFEST_URL}"

      - run: npm run typecheck
      - run: npm run build

      - name: Commit release metadata changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/latestRelease.json public/feed.xml
          if git diff --cached --quiet; then
            echo "No release metadata changes to commit."
            exit 0
          fi
          git commit -m "Sync KiJi release metadata"
          git push
